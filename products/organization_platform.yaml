tenant_id: businesaios
product_id: organization_platform
product_version: v1
domain: organization_platform
name: BusinesAIOS Workspace
environment: prod
modules:
  workspace: true
  pricing: true
  offers: true
  ads: true
  audio: false
entry_policy:
  entrypoints: [telegram, webapp, api]
  default_entrypoint: telegram
  requires_auth: true
  requires_entitlement: false
  required_entitlements: []
entitlements:
  keys: [workspace.access, workspace.paid, workspace.admin]
offer_catalog_ref: default:organization_platform:prod
autopilot_contract_ref: default
economics:
  target_cac_rub: 600
  target_payback_days: 30
  min_ltv_cac_ratio: 2.0
pricing_model:
  id: pricing_ladder@v1
  params:
    default_offer_id: org_launch
    context_field: lifecycle_stage
    offer_by_value:
      launch: org_launch
      growth: org_scale
      scale: org_scale
telemetry_schema:
  id: organization_platform_telemetry_v1
  params: {}
