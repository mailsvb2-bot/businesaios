tenant_id: businesaios-sales
product_id: salesbot
product_version: v1
domain: sales
name: SalesBot
environment: prod
modules:
  audio: false
  pricing: true
  offers: true
entry_policy:
  entrypoints: [telegram]
  default_entrypoint: telegram
  requires_auth: true
  requires_entitlement: false
  required_entitlements: []
entitlements:
  keys: []
offer_catalog_ref: default:salesbot:prod
autopilot_contract_ref: default
economics:
  target_cac_rub: 600
  target_payback_days: 30
  min_ltv_cac_ratio: 2.0
pricing_model:
  id: pricing_fixed@v1
  params:
    offer_id: sales_entry
offer_catalog:
  id: offer_catalog_sales@v1
  params: {}
telemetry_schema:
  id: telemetry_default@v1
  params:
    sla_router_p95_ms: 250
