name: Deep Release Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  pull_request_target:
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.event_name == 'pull_request_target' && github.event.pull_request.merged == true && github.event.pull_request.merge_commit_sha || github.event_name == 'pull_request_target' && format('pr-{0}-closed-unmerged', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  BAIOS_CI_TARGET_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merged == true && github.event.pull_request.merge_commit_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  PYTHON_BASE_IMAGE_SOURCE: python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
  PYTHON_BASE_IMAGE_LOCAL: businesaios/python-runtime-base:3.12-slim

jobs:
  release-proof:
    if: >-
      (github.event_name != 'pull_request_target' || github.event.pull_request.merged == true) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: businesaios
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d businesaios"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.BAIOS_CI_TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ env.BAIOS_CI_TARGET_SHA }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install release dependencies and PostgreSQL client
        run: |
          set -Eeuo pipefail
          APT_BOUNDS=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
          )
          sudo timeout --signal=TERM --kill-after=30s 5m apt-get "${APT_BOUNDS[@]}" update
          sudo timeout --signal=TERM --kill-after=30s 5m apt-get "${APT_BOUNDS[@]}" install -y --no-install-recommends postgresql-client
          command -v pg_isready >/dev/null
          command -v psql >/dev/null
          command -v pg_dump >/dev/null
          command -v pg_restore >/dev/null
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --require-hashes -r requirements.release.lock.txt

      - name: Install locked frontend dependencies and browsers
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright install --with-deps chromium firefox webkit

      - name: Resolve host gateway and verify PostgreSQL
        run: |
          set -Eeuo pipefail
          GATEWAY="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
          test -n "$GATEWAY"
          DATABASE_URL="postgresql://postgres:postgres@${GATEWAY}:5432/businesaios"
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
          echo "POSTGRES_DSN=$DATABASE_URL" >> "$GITHUB_ENV"
          echo "POSTGRES_RUNTIME_ENABLED=1" >> "$GITHUB_ENV"
          echo "POSTGRES_EVENT_STORE_ENABLED=1" >> "$GITHUB_ENV"
          echo "POSTGRES_APPLY_MIGRATIONS=1" >> "$GITHUB_ENV"
          echo "RUN_MIGRATIONS_BEFORE_START=1" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if pg_isready -d "$DATABASE_URL"; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Apply migrations and prove backup restore
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/ci
          .venv/bin/python -m scripts.ci.cli --gate postgres-migrations

          cleanup_source_probe() {
            psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 \
              --command='DROP SCHEMA IF EXISTS deep_release_backup_probe CASCADE;' >/dev/null 2>&1 || true
          }
          trap cleanup_source_probe EXIT

          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --set=expected_sha="$BAIOS_CI_TARGET_SHA" <<'SQL'
          DROP SCHEMA IF EXISTS deep_release_backup_probe CASCADE;
          CREATE SCHEMA deep_release_backup_probe;
          CREATE TABLE deep_release_backup_probe.restore_sentinel (
            id INTEGER PRIMARY KEY,
            commit_sha TEXT NOT NULL
          );
          INSERT INTO deep_release_backup_probe.restore_sentinel (id, commit_sha)
          VALUES (1, :'expected_sha');
          SQL

          BACKUP_DUMP_PATH="$PWD/artifacts/ci/postgres_backup.dump"
          pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges --file="$BACKUP_DUMP_PATH"
          test -s "$BACKUP_DUMP_PATH"

          cleanup_source_probe
          trap - EXIT

          RESTORE_DB="businesaios_restore_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          ADMIN_DSN="${DATABASE_URL%/*}/postgres"
          psql "$ADMIN_DSN" --set=ON_ERROR_STOP=1 --command="CREATE DATABASE ${RESTORE_DB};"
          RESTORE_DSN="${DATABASE_URL%/*}/${RESTORE_DB}"
          pg_restore --exit-on-error --no-owner --no-privileges --dbname="$RESTORE_DSN" "$BACKUP_DUMP_PATH"

          RESTORED_SHA="$(
            psql "$RESTORE_DSN" --no-align --tuples-only --set=ON_ERROR_STOP=1 \
              --command='SELECT commit_sha FROM deep_release_backup_probe.restore_sentinel WHERE id = 1;'
          )"
          RESTORED_SHA="$(printf '%s' "$RESTORED_SHA" | tr -d '[:space:]')"
          test "$RESTORED_SHA" = "$BAIOS_CI_TARGET_SHA"

          DUMP_SHA256="$(sha256sum "$BACKUP_DUMP_PATH" | awk '{print $1}')"
          export DUMP_SHA256 RESTORE_DB
          .venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "contract": "businesaios.postgres_backup_restore_evidence.v1",
              "commit_sha": os.environ["BAIOS_CI_TARGET_SHA"],
              "dump_path": "artifacts/ci/postgres_backup.dump",
              "dump_sha256": os.environ["DUMP_SHA256"],
              "restore_database": os.environ["RESTORE_DB"],
          }
          Path("artifacts/ci/postgres_backup_restore_evidence.json").write_text(
              json.dumps(payload, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          echo "POSTGRES_BACKUP_EVIDENCE_PATH=$PWD/artifacts/ci/postgres_backup_restore_evidence.json" >> "$GITHUB_ENV"
          echo "POSTGRES_RESTORE_DSN=$RESTORE_DSN" >> "$GITHUB_ENV"

      - name: Install cargo-audit for deep supply-chain proof
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/ci
          cd /tmp
          cargo install cargo-audit --locked
          cargo audit --version | tee "$GITHUB_WORKSPACE/artifacts/ci/cargo_audit_version.txt"

      - name: Prepare vetted local Python base image
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/ci
          docker pull "$PYTHON_BASE_IMAGE_SOURCE"
          docker tag "$PYTHON_BASE_IMAGE_SOURCE" "$PYTHON_BASE_IMAGE_LOCAL"
          docker image inspect "$PYTHON_BASE_IMAGE_SOURCE" > artifacts/ci/python_base_image_inspect.json
          docker image inspect "$PYTHON_BASE_IMAGE_LOCAL" >/dev/null

      - name: Run real ephemeral staging proof
        env:
          PYTHON_BIN: ${{ github.workspace }}/.venv/bin/python
          GIT_COMMIT_SHA: ${{ env.BAIOS_CI_TARGET_SHA }}
          BAIOS_STAGING_PROOF_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
          BAIOS_STAGING_TIMEOUT_SECONDS: "240"
          BAIOS_PYTHON_BASE_IMAGE: ${{ env.PYTHON_BASE_IMAGE_LOCAL }}
        run: |
          set -Eeuo pipefail
          bash scripts/staging/run_staging_runtime_proof.sh
          .venv/bin/python -m scripts.ci.cli --gate staging-runtime

      - name: Run canonical release gate
        env:
          BAIOS_REQUIRE_TRANSITIVE_DEPENDENCY_LOCK: "1"
          GIT_COMMIT_SHA: ${{ env.BAIOS_CI_TARGET_SHA }}
        run: .venv/bin/python -m scripts.ci.cli --gate release

      - name: Upload deep release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deep-release-${{ env.BAIOS_CI_TARGET_SHA }}
          path: |
            artifacts/ci
            release/manifest.json
            dist
            build
          if-no-files-found: warn
