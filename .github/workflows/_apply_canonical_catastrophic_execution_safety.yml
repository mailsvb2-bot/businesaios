name: Apply canonical catastrophic execution safety repair

on:
  push:
    branches:
      - agent/canonical-catastrophic-safety-repair
    paths:
      - tools/_apply_canonical_catastrophic_execution_safety.py
      - .github/workflows/_apply_canonical_catastrophic_execution_safety.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/_apply_canonical_catastrophic_execution_safety.py
      - .github/workflows/_apply_canonical_catastrophic_execution_safety.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/canonical-catastrophic-safety-repair
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply canonical repair
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tools/_apply_canonical_catastrophic_execution_safety.py
      - name: Compile changed Python
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m compileall -q \
            application/business_autonomy \
            runtime/business_autonomy \
            tests/regression/test_canonical_catastrophic_execution_safety.py
          git diff --check
      - name: Commit canonical repair
        run: |
          rm tools/_apply_canonical_catastrophic_execution_safety.py
          rm .github/workflows/_apply_canonical_catastrophic_execution_safety.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Close canonical execution safety failures"
          git push origin HEAD:agent/canonical-catastrophic-safety-repair
