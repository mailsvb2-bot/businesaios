name: Apply canonical catastrophic execution safety repair

on:
  push:
    branches:
      - agent/canonical-catastrophic-safety-repair
    paths:
      - tools/_apply_canonical_catastrophic_execution_safety.py
      - .github/workflows/_apply_canonical_catastrophic_execution_safety.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/_apply_canonical_catastrophic_execution_safety.py
      - .github/workflows/_apply_canonical_catastrophic_execution_safety.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/canonical-catastrophic-safety-repair
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply canonical repair
        id: apply
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set +e
          python tools/_apply_canonical_catastrophic_execution_safety.py > /tmp/canonical-repair.log 2>&1
          status=$?
          cat /tmp/canonical-repair.log
          printf '%s\n' "$status" > /tmp/canonical-repair-status
          exit "$status"
      - name: Publish deterministic failure evidence
        if: steps.apply.outcome == 'failure'
        shell: bash
        run: |
          git reset --hard HEAD
          cp /tmp/canonical-repair.log tools/_canonical_repair_error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/_canonical_repair_error.txt
          git commit -m "Record canonical repair failure evidence"
          git push origin HEAD:agent/canonical-catastrophic-safety-repair
      - name: Compile changed Python
        if: steps.apply.outcome == 'success'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m compileall -q \
            application/business_autonomy \
            runtime/business_autonomy \
            tests/regression/test_canonical_catastrophic_execution_safety.py
          git diff --check
      - name: Commit canonical repair
        if: steps.apply.outcome == 'success'
        run: |
          rm tools/_apply_canonical_catastrophic_execution_safety.py
          rm .github/workflows/_apply_canonical_catastrophic_execution_safety.yml
          rm -f tools/_canonical_repair_error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Close canonical execution safety failures"
          git push origin HEAD:agent/canonical-catastrophic-safety-repair
      - name: Fail workflow after evidence publication
        if: steps.apply.outcome == 'failure'
        run: exit 1
