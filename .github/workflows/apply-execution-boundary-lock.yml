name: Apply execution boundary lock

on:
  push:
    branches:
      - agent/issue-172-execution-boundary-lock

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply guarded one-line exception contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('execution/closed_loop_orchestrator.py')
          text = path.read_text(encoding='utf-8')
          old = "            except Exception as exc:\n                bundle_payloads = [bundle]\n"
          new = "            except (OSError, UnicodeError, ValueError) as exc:\n                bundle_payloads = [bundle]\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one guarded target, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/apply-execution-boundary-lock.yml
          git diff --check

      - name: Commit exact patch and remove helper workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add execution/closed_loop_orchestrator.py .github/workflows/apply-execution-boundary-lock.yml
          git commit -m "Narrow closed-loop restore exceptions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
