name: A4 lockfile refresh

on:
  push:
    branches:
      - agent/autonomous-release-browser-e2e
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Generate exact frontend lockfile
        working-directory: frontend
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify frozen install contract
        working-directory: frontend
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/package-lock.json; then
            echo "package-lock already exact"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          test "$(git diff --cached --name-only)" = "frontend/package-lock.json"
          git commit -m "Lock Playwright browser E2E dependencies"
          git push origin HEAD:agent/autonomous-release-browser-e2e
