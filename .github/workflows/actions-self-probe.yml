name: actions-self-probe

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.number == 219 && github.event.comment.body == '[actions-probe]')
    runs-on: ubuntu-latest
    steps:
      - name: Report successful workflow execution
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          gh api "repos/${REPOSITORY}/issues/219/comments" \
            --method POST \
            -f body="ACTIONS_PROBE_OK event=${EVENT_NAME} run=${RUN_ID} sha=${HEAD_SHA}"
