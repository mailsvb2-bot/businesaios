name: Apply client outcome auth perimeter fix

on:
  push:
    branches:
      - agent/full-pytest-security-repair
    paths:
      - .github/workflows/apply-client-outcome-auth-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/full-pytest-security-repair
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/patches/client-outcome-auth.patch.gz.b64 | gzip -dc > /tmp/client-outcome-auth.patch
          test "$(sha256sum /tmp/client-outcome-auth.patch | awk '{print $1}')" = "0c34e11c36f198460f33995e5072aae85b160a0e01e9a4a8d6244cbb8049077b"
          git apply --check /tmp/client-outcome-auth.patch
          git apply /tmp/client-outcome-auth.patch
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
      - name: Prove API security regression wall
        run: |
          python -m pytest -q \
            tests/api/test_auth_dependencies.py \
            tests/api/test_control_plane_auth_and_guards.py \
            tests/api/test_fastapi_execute_action_stack_wave11.py \
            tests/api/test_public_surface_security_guard_wave183.py \
            tests/unit/client_outcome
      - name: Commit canonical result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patches/client-outcome-auth.patch.gz.b64
          rm -f .github/workflows/apply-client-outcome-auth-fix.yml
          rmdir .github/patches 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Close client outcome auth perimeter"
          git push origin HEAD:agent/full-pytest-security-repair
