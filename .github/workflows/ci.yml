name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-reviewed-corrections:
    if: github.event_name == 'pull_request' && github.event.action == 'reopened'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
      - name: Apply reviewed corrections
        shell: bash
        run: |
          set -euo pipefail
          source_workflow=.github/workflows/apply-execution-reliability-wave1-ci-fix.yml
          sed -n "/<<'PATCH_B64'/,/^PATCH_B64$/p" "$source_workflow" | sed '1d;$d' > /tmp/fix.patch.gz.b64
          test -s /tmp/fix.patch.gz.b64
          base64 -d /tmp/fix.patch.gz.b64 | gzip -d > /tmp/fix.patch
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
      - name: Validate exact failed contours
        run: |
          python -m compileall -q reliability/idempotency_sqlite_backend.py runtime/execution/reliability_runtime.py runtime/execution/executor_reliability.py tests/unit/runtime/test_execution_reliability_fail_closed.py
          python -m pytest -q \
            tests/test_crash_recovery_outbox.py \
            tests/test_decision_ledger.py \
            tests/test_outbox_crash_between_send_and_mark.py \
            tests/test_ring_invariant.py \
            tests/test_security.py \
            tests/unit/runtime/test_execution_reliability_fail_closed.py \
            tests/lock/test_execution_reliability_exception_contract.py \
            tests/arch/test_canon_collapse_principles.py \
            tests/test_architecture.py \
            tests/reliability \
            tests/unit/runtime/test_outcome_persistence_lock_wave4.py \
            tests/unit/runtime/execution/test_headless_failure_boundary.py
      - name: Publish clean corrected head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f \
            .github/workflows/apply-execution-reliability-wave1-ci-fix.yml \
            .github/workflows/apply-execution-reliability-wave1-ci-fix-trigger.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve explicit retry and recovery compatibility'
          git push origin HEAD:agent/execution-reliability-fail-closed-wave1

  clean-source:
    name: clean source archive (3.12)
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify dependency lock
        run: python scripts/ci/check_requirements_lock.py
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
      - name: Build exact tracked source archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/businesaios-clean-source
          mkdir -p /tmp/businesaios-clean-source
          git archive --format=tar HEAD | tar -xf - -C /tmp/businesaios-clean-source
          test ! -d /tmp/businesaios-clean-source/.git
          test ! -d /tmp/businesaios-clean-source/artifacts
      - name: Verify archive without git metadata
        working-directory: /tmp/businesaios-clean-source
        run: |
          set -euo pipefail
          python scripts/ci/check_requirements_lock.py
          python -m pytest -q \
            tests/security/test_no_secrets_committed.py \
            tests/lock/test_tracked_files_fallback.py \
            tests/lock/test_runtime_data_artifacts_not_tracked.py \
            tests/lock/test_runtime_release_package_hygiene.py \
            tests/business_critical/test_rust_safety_dependency_lock.py \
            tests/unit/execution/test_evidence_identity_determinism.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify dependency lock
        run: python scripts/ci/check_requirements_lock.py
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
      - name: Run canonical business-critical CI gate
        run: python -m scripts.ci.cli --gate business-critical
      - name: Upload business-critical gate artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-${{ matrix.python-version }}-artifacts
          path: artifacts/ci
          if-no-files-found: warn

  complete-tree:
    name: complete pytest tree (3.12)
    needs: test
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      BUSINESAIOS_DEEP_TEST_CLEANUP: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify dependency lock
        run: python scripts/ci/check_requirements_lock.py
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
      - name: Create exact source snapshot for failure analysis
        shell: bash
        run: |
          mkdir -p artifacts/ci/complete-tree
          tar \
            --exclude=.git \
            --exclude=artifacts \
            --exclude='*/__pycache__/*' \
            --exclude='*.pyc' \
            -czf /tmp/businesaios-source-snapshot.tar.gz .
          cp /tmp/businesaios-source-snapshot.tar.gz artifacts/ci/complete-tree/source-snapshot.tar.gz
      - name: Run complete pytest tree without quarantine
        shell: bash
        run: |
          mkdir -p artifacts/ci/complete-tree
          set +e
          pytest -q tests \
            --junitxml=artifacts/ci/complete-tree/junit.xml \
            2>&1 | tee artifacts/ci/complete-tree/pytest.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > artifacts/ci/complete-tree/exit-code.txt
          exit "$status"
      - name: Upload complete-tree artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-complete-tree-artifacts
          path: artifacts/ci/complete-tree
          if-no-files-found: warn
