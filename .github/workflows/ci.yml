name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BAIOS_CI_TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.merge_commit_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  clean-source:
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    name: clean source archive (3.12)
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.BAIOS_CI_TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ env.BAIOS_CI_TARGET_SHA }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify dependency lock
        run: python scripts/ci/check_requirements_lock.py
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
      - name: Build exact tracked source archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/businesaios-clean-source
          mkdir -p /tmp/businesaios-clean-source
          git archive --format=tar HEAD | tar -xf - -C /tmp/businesaios-clean-source
          test ! -d /tmp/businesaios-clean-source/.git
          test ! -d /tmp/businesaios-clean-source/artifacts
      - name: Verify archive without git metadata
        working-directory: /tmp/businesaios-clean-source
        run: |
          set -euo pipefail
          python scripts/ci/check_requirements_lock.py
          python -m pytest -q \
            tests/security/test_no_secrets_committed.py \
            tests/lock/test_tracked_files_fallback.py \
            tests/lock/test_runtime_data_artifacts_not_tracked.py \
            tests/lock/test_runtime_release_package_hygiene.py \
            tests/business_critical/test_rust_safety_dependency_lock.py \
            tests/unit/execution/test_evidence_identity_determinism.py

  test:
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.BAIOS_CI_TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ env.BAIOS_CI_TARGET_SHA }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify dependency lock
        run: python scripts/ci/check_requirements_lock.py
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
      - name: Run canonical business-critical CI gate
        run: python -m scripts.ci.cli --gate business-critical
      - name: Upload business-critical gate artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-${{ matrix.python-version }}-artifacts
          path: artifacts/ci
          if-no-files-found: warn

  frontend:
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    name: frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.BAIOS_CI_TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ env.BAIOS_CI_TARGET_SHA }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
      - name: Verify production bundle
        run: test -s frontend/dist/index.html
      - name: Upload frontend bundle
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  complete-tree:
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    name: complete pytest tree (3.12)
    needs: test
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      BUSINESAIOS_DEEP_TEST_CLEANUP: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.BAIOS_CI_TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ env.BAIOS_CI_TARGET_SHA }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify dependency lock
        run: python scripts/ci/check_requirements_lock.py
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
      - name: Create exact source snapshot for failure analysis
        shell: bash
        run: |
          mkdir -p artifacts/ci/complete-tree
          tar \
            --exclude=.git \
            --exclude=artifacts \
            --exclude='*/__pycache__/*' \
            --exclude='*.pyc' \
            -czf /tmp/businesaios-source-snapshot.tar.gz .
          cp /tmp/businesaios-source-snapshot.tar.gz artifacts/ci/complete-tree/source-snapshot.tar.gz
      - name: Run complete pytest tree without quarantine
        shell: bash
        run: |
          mkdir -p artifacts/ci/complete-tree
          set +e
          pytest -q tests \
            --junitxml=artifacts/ci/complete-tree/junit.xml \
            2>&1 | tee artifacts/ci/complete-tree/pytest.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > artifacts/ci/complete-tree/exit-code.txt
          exit "$status"
      - name: Upload complete-tree artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-complete-tree-artifacts
          path: artifacts/ci/complete-tree
          if-no-files-found: warn
