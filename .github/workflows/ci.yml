name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  pull_request_target:
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.event_name == 'pull_request_target' && github.event.pull_request.merged == true && github.event.pull_request.merge_commit_sha || github.event_name == 'pull_request_target' && format('pr-{0}-closed-unmerged', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  BAIOS_CI_TARGET_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merged == true && github.event.pull_request.merge_commit_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  clean-source:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    name: clean source archive (3.12)
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.BAIOS_CI_TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ env.BAIOS_CI_TARGET_SHA }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify dependency lock
        run: python scripts/ci/check_requirements_lock.py
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
      - name: Build exact tracked source archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/businesaios-clean-source
          mkdir -p /tmp/businesaios-clean-source
          git archive --format=tar HEAD | tar -xf - -C /tmp/businesaios-clean-source
          test ! -d /tmp/businesaios-clean-source/.git
          test ! -d /tmp/businesaios-clean-source/artifacts
      - name: Verify archive without git metadata
        working-directory: /tmp/businesaios-clean-source
        run: |
          set -euo pipefail
          python scripts/ci/check_requirements_lock.py
          python -m pytest -q tests/security/test_no_secrets_committed.py tests/lock/test_tracked_files_fallback.py tests/lock/test_runtime_data_artifacts_not_tracked.py tests/lock/test_runtime_release_package_hygiene.py tests/business_critical/test_rust_safety_dependency_lock.py tests/unit/execution/test_evidence_identity_determinism.py

  test:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.BAIOS_CI_TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ env.BAIOS_CI_TARGET_SHA }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify dependency lock
        run: python scripts/ci/check_requirements_lock.py
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
      - name: Run canonical business-critical CI gate
        run: python -m scripts.ci.cli --gate business-critical
      - name: Upload business-critical gate artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-${{ matrix.python-version }}-artifacts
          path: artifacts/ci
          if-no-files-found: warn

  frontend:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    name: frontend production build + browser E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.BAIOS_CI_TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ env.BAIOS_CI_TARGET_SHA }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Verify dependency lock
        run: python scripts/ci/check_requirements_lock.py
      - name: Install locked Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
      - name: Install locked frontend dependencies and browsers
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Run canonical browser gate
        run: python -m scripts.ci.cli --gate browser
      - name: Rebuild canonical production frontend bundle
        working-directory: frontend
        run: env -u VITE_API_BASE npm run build
      - name: Bind production frontend bundle to exact SHA
        shell: bash
        run: |
          set -euo pipefail
          BAIOS_FRONTEND_SHA="$BAIOS_CI_TARGET_SHA" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          dist = Path("frontend/dist")
          sha = os.environ["BAIOS_FRONTEND_SHA"].strip().lower()
          if len(sha) != 40 or any(ch not in "0123456789abcdef" for ch in sha):
              raise SystemExit("BAIOS_CI_TARGET_SHA must be a full lowercase git SHA")
          files = {
              path.relative_to(dist).as_posix(): hashlib.sha256(path.read_bytes()).hexdigest()
              for path in sorted(dist.rglob("*"))
              if path.is_file() and path.name != "release-manifest.json"
          }
          if "index.html" not in files or not any(name.startswith("assets/") for name in files):
              raise SystemExit("frontend bundle must contain index.html and at least one asset")
          manifest = {"schema_version": 1, "commit_sha": sha, "files": files}
          (dist / "release-manifest.json").write_text(json.dumps(manifest, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Verify production bundle
        shell: bash
        run: |
          test -s frontend/dist/index.html
          test -s frontend/dist/release-manifest.json
          grep -F -q "$BAIOS_CI_TARGET_SHA" frontend/dist/release-manifest.json
          grep -R -F -q "https://api.businessaios.ru" frontend/dist
      - name: Upload frontend bundle
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-e2e-artifacts
          path: artifacts/ci
          if-no-files-found: error

  complete-tree:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    name: complete pytest tree (3.12)
    needs: test
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      BUSINESAIOS_DEEP_TEST_CLEANUP: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.BAIOS_CI_TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ env.BAIOS_CI_TARGET_SHA }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify dependency lock
        run: python scripts/ci/check_requirements_lock.py
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
      - name: Create exact source snapshot for failure analysis
        shell: bash
        run: |
          mkdir -p artifacts/ci/complete-tree
          tar --exclude=.git --exclude=artifacts --exclude='*/__pycache__/*' --exclude='*.pyc' -czf /tmp/businesaios-source-snapshot.tar.gz .
          cp /tmp/businesaios-source-snapshot.tar.gz artifacts/ci/complete-tree/source-snapshot.tar.gz
      - name: Run complete pytest tree without quarantine
        shell: bash
        run: |
          mkdir -p artifacts/ci/complete-tree
          set +e
          pytest -q tests --junitxml=artifacts/ci/complete-tree/junit.xml 2>&1 | tee artifacts/ci/complete-tree/pytest.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > artifacts/ci/complete-tree/exit-code.txt
          exit "$status"
      - name: Upload complete-tree artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-complete-tree-artifacts
          path: artifacts/ci/complete-tree
          if-no-files-found: warn

  windows-acceptance:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    name: Windows canonical user scenarios (3.12)
    runs-on: windows-2025
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.BAIOS_CI_TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify exact checkout
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ env.BAIOS_CI_TARGET_SHA }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "exact checkout mismatch: $actual != $env:EXPECTED_SHA" }
      - name: Install canonical Rust toolchain
        shell: pwsh
        run: |
          $toolchain = (python -c "import tomllib; print(tomllib.load(open('rust/rust-toolchain.toml','rb'))['toolchain']['channel'])").Trim()
          if (-not $toolchain) { throw "canonical Rust toolchain channel is empty" }
          $installed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            rustup toolchain install $toolchain --profile minimal --no-self-update
            if ($LASTEXITCODE -eq 0) { $installed = $true; break }
            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }
          if (-not $installed) { throw "failed to install canonical Rust toolchain $toolchain"
          }
          Push-Location rust
          cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Verify dependency lock
        run: python scripts/ci/check_requirements_lock.py
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
      - name: Prime locked Rust dependency cache
        shell: pwsh
        run: |
          Push-Location rust/businessaios_safety_core
          $fetched = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            cargo fetch --locked
            if ($LASTEXITCODE -eq 0) { $fetched = $true; break }
            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }
          Pop-Location
          if (-not $fetched) { throw "failed to fetch locked Rust dependencies" }
      - name: Run canonical user scenario acceptance gate
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere is required for the Windows MSVC acceptance environment" }
          $installation = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $installation) { throw "Visual C++ x64 toolchain is required for Windows acceptance" }
          $vcvars = Join-Path $installation "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat missing from resolved Visual Studio installation" }
          cmd /d /s /c "`"$vcvars`" && where link && set CARGO_NET_OFFLINE=true && python -m scripts.ci.cli --gate acceptance"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-acceptance-artifacts
          path: artifacts/ci
          if-no-files-found: error
