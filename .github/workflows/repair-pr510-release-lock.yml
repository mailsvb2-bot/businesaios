name: Repair PR510 release dependency lock
on:
  push:
    branches:
      - integrate/port-mega-112-20261023
    paths:
      - .github/workflows/repair-pr510-release-lock.yml
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'mailsvb2-bot/businesaios'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate and verify pinned release lock
        run: |
          python -m pip install 'uv==0.10.0'
          bash scripts/ci/generate_release_lock.sh
          BAIOS_REQUIRE_TRANSITIVE_DEPENDENCY_LOCK=1 python scripts/ci/check_requirements_lock.py
          python -m pip install --require-hashes -r requirements.release.lock.txt
      - name: Commit generated lock to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements.release.lock.txt
          git diff --cached --quiet && exit 0
          git commit -m 'fix: regenerate hash-locked Pillow release dependency graph'
          git push origin HEAD:integrate/port-mega-112-20261023
