name: Full pytest repair proof

on:
  push:
    branches:
      - agent/full-pytest-security-repair
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-pytest-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reported-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run reported regression contour
        id: targeted
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pytest -q \
            tests/test_decision_core_gate_fail_closed_v27.py \
            tests/test_decision_ledger.py \
            tests/test_single_decision_envelope_definition.py \
            tests/test_runtime_decision_gateway.py \
            tests/test_security.py \
            tests/test_hidden_business_logic_wave9.py \
            tests/test_retention_engine.py \
            > reported-regressions.log 2>&1
          code=$?
          echo "$code" > reported-regressions.exit-code
          cat reported-regressions.log
          exit "$code"

      - name: Upload reported regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reported-regressions-${{ github.sha }}
          path: |
            reported-regressions.log
            reported-regressions.exit-code
          if-no-files-found: error
          retention-days: 7

      - name: Enforce reported regression success
        if: always()
        shell: bash
        run: |
          test -f reported-regressions.exit-code
          test "$(cat reported-regressions.exit-code)" = "0"

  full-pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Archive exact checkout
        run: |
          tar --exclude=.git --exclude=.pytest_cache --exclude=__pycache__ -czf ../businesaios-full-checkout.tgz .
          mv ../businesaios-full-checkout.tgz .

      - name: Run documented full pytest command
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pytest -q > full-pytest.log 2>&1
          code=$?
          echo "$code" > full-pytest.exit-code
          cat full-pytest.log
          exit "$code"

      - name: Upload checkout and full pytest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-pytest-repair-${{ github.sha }}
          path: |
            businesaios-full-checkout.tgz
            full-pytest.log
            full-pytest.exit-code
          if-no-files-found: error
          retention-days: 7

      - name: Enforce full pytest success
        if: always()
        shell: bash
        run: |
          test -f full-pytest.exit-code
          test "$(cat full-pytest.exit-code)" = "0"
