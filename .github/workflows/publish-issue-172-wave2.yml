name: Publish issue 172 wave 2

on:
  push:
    branches:
      - agent/issue-172-exception-contracts-wave-2

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/issue-172-exception-contracts-wave-2
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Apply verified exception contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('execution/approval_execution_gate.py')
          text = path.read_text(encoding='utf-8')
          assert text.count('except Exception as exc:') >= 3
          path.write_text(text.replace('except Exception as exc:', 'except (RuntimeError, ValueError) as exc:', 3), encoding='utf-8')

          path = Path('execution/evidence_persistence_reliability.py')
          text = path.read_text(encoding='utf-8')
          assert 'import inspect\n' not in text
          text = text.replace('import hashlib\n', 'import hashlib\nimport inspect\n', 1)
          old = """        latest = None
          try:
              latest = self.checkpoint_store.latest(tenant_id=self.tenant_id(tenant_id=tenant_id), run_id=str(run_id))
          except Exception:
              latest = None
          """
          new = """        latest = self.checkpoint_store.latest(
              tenant_id=self.tenant_id(tenant_id=tenant_id),
              run_id=str(run_id),
          )
          """
          assert old in text
          text = text.replace(old, new, 1)
          old = """        try:
              return bool(self.replay_guard.is_replay(tenant_id=self.tenant_id(tenant_id=tenant_id), run_id=str(run_id), persistence_key=str(persistence_key)))
          except TypeError:
              try:
                  return bool(self.replay_guard.is_replay(str(persistence_key)))
              except Exception:
                  return False
          except Exception:
              return False
          """
          new = """        is_replay = self.replay_guard.is_replay
          parameters = inspect.signature(is_replay).parameters.values()
          names = {parameter.name for parameter in parameters}
          supports_keywords = any(
              parameter.kind is inspect.Parameter.VAR_KEYWORD
              for parameter in parameters
          ) or {'tenant_id', 'run_id', 'persistence_key'} <= names
          if supports_keywords:
              return bool(
                  is_replay(
                      tenant_id=self.tenant_id(tenant_id=tenant_id),
                      run_id=str(run_id),
                      persistence_key=str(persistence_key),
                  )
              )
          return bool(is_replay(str(persistence_key)))
          """
          assert old in text
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('execution/market_intelligence_cursor_store.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('        except Exception:\n            return ProviderCursor(', '        except (UnicodeDecodeError, json.JSONDecodeError):\n            return ProviderCursor(', 1)
          text = text.replace('        except Exception:\n            return ProviderCursor(', '        except (TypeError, ValueError):\n            return ProviderCursor(', 1)
          text = text.replace('            except Exception:\n                continue', '            except (UnicodeDecodeError, json.JSONDecodeError):\n                continue', 1)
          path.write_text(text, encoding='utf-8')

          path = Path('execution/closed_loop_economic_state.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('    except Exception:\n        return None', '    except (TypeError, ValueError, OverflowError):\n        return None', 1)
          text = text.replace('        except Exception:\n            pass', '        except AttributeError:\n            pass', 1)
          path.write_text(text, encoding='utf-8')

          path = Path('execution/economic_export_manifest.py')
          text = path.read_text(encoding='utf-8')
          old = """    try:
              rows = list_rows()
          except Exception:
              return None
          try:
              return len(tuple(rows))
          except Exception:
              return None
          """
          new = """    rows = list_rows()
          try:
              return len(tuple(rows))
          except TypeError:
              return None
          """
          assert old in text
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify wave
        run: |
          python -m pip install -r requirements.lock.txt
          python -m compileall -q runtime/execution/executor_autonomy_gate.py runtime/execution/executor_trace_runtime.py execution/approval_execution_gate.py execution/evidence_persistence_reliability.py execution/market_intelligence_cursor_store.py execution/closed_loop_economic_state.py execution/economic_export_manifest.py
          test "$(grep -R 'except Exception' -n runtime/execution execution | wc -l)" = '32'
          python -m pytest -q \
            tests/unit/runtime/test_runtime_exception_contracts_followup.py \
            tests/unit/execution/test_evidence_persistence_exception_contracts.py \
            tests/unit/execution/test_market_intelligence_cursor_exception_contracts.py \
            tests/unit/execution/test_approval_gate_exception_contracts.py \
            tests/unit/execution/test_economic_state_exception_contracts.py \
            tests/unit/runtime/test_executor_entrypoint_bundle_wave3.py \
            tests/unit/runtime/execution/test_governance_single_runtime_wave14.py \
            tests/execution/test_approval_gate_replay_hardening.py \
            tests/execution/test_approval_gate_fingerprint_stability.py \
            tests/execution/test_evidence_persistence_reliability_integration.py \
            tests/execution/test_evidence_persistence_runtime_effect_delivery.py \
            tests/e2e/test_live_canary_exception_evidence.py \
            tests/e2e/test_live_canary_executor_hook.py \
            tests/arch/test_canon_collapse_principles.py::test_metrics_do_not_grow

      - name: Commit verified wave
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-issue-172-wave2.yml
          git add runtime/execution/executor_autonomy_gate.py runtime/execution/executor_trace_runtime.py execution/approval_execution_gate.py execution/evidence_persistence_reliability.py execution/market_intelligence_cursor_store.py execution/closed_loop_economic_state.py execution/economic_export_manifest.py tests/unit/runtime/test_runtime_exception_contracts_followup.py tests/unit/execution/test_evidence_persistence_exception_contracts.py tests/unit/execution/test_market_intelligence_cursor_exception_contracts.py tests/unit/execution/test_approval_gate_exception_contracts.py tests/unit/execution/test_economic_state_exception_contracts.py
          git commit -m 'Narrow execution exception contracts wave 2'
          git push origin HEAD:agent/issue-172-exception-contracts-wave-2
