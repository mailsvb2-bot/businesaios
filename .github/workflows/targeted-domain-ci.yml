name: targeted-domain-ci

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  pull_request_target:
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.event_name == 'pull_request_target' && github.event.pull_request.merged == true && github.event.pull_request.merge_commit_sha || github.event_name == 'pull_request_target' && format('pr-{0}-closed-unmerged', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  BAIOS_CI_TARGET_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merged == true && github.event.pull_request.merge_commit_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  BAIOS_TARGETED_BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event_name == 'pull_request_target' && github.event.pull_request.merged == true && github.event.pull_request.base.sha || '' }}

jobs:
  targeted-domain-ci:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.BAIOS_CI_TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ env.BAIOS_CI_TARGET_SHA }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify dependency lock
        run: python scripts/ci/check_requirements_lock.py
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
      - name: Resolve targeted diff base
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$BAIOS_TARGETED_BASE_SHA" ]; then
            git cat-file -e "${BAIOS_TARGETED_BASE_SHA}^{commit}"
            echo "TARGETED_CI_BASE=$BAIOS_TARGETED_BASE_SHA" >> "$GITHUB_ENV"
          else
            git fetch --no-tags --prune origin main
            echo "TARGETED_CI_BASE=origin/main" >> "$GITHUB_ENV"
          fi
      - name: Run targeted domain CI
        run: python -m scripts.ci.cli --gate targeted-domain
      - name: Upload targeted-domain artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: targeted-domain-${{ matrix.python-version }}-artifacts
          path: artifacts/ci
          if-no-files-found: warn
