name: Agent materialize final patch

on:
  push:
    branches:
      - agent/client-outcome-idempotency-lease-recovery

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Materialize reviewed patch
        run: python tools/agent_materialize_payload.py
      - name: Commit final tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Close honest full-suite debt and canonical runtime boundaries'
          git push origin HEAD:agent/client-outcome-idempotency-lease-recovery
