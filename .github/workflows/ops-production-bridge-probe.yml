name: Ops Production Bridge Probe

on:
  push:
    branches:
      - feat/owner-intelligence-cockpit
    paths:
      - .github/workflows/ops-production-bridge-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, production]
    environment: production
    timeout-minutes: 5
    steps:
      - name: Probe existing SSH administration channel
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=$(id -un) home=$HOME"
          command -v ssh || true
          ssh -V 2>&1 || true
          echo '--- runner ssh metadata (no contents) ---'
          if [[ -d "$HOME/.ssh" ]]; then
            find "$HOME/.ssh" -maxdepth 1 -type f -printf '%f mode=%m size=%s\n' | sort
          else
            echo 'no runner .ssh directory'
          fi
          echo '--- batch-mode localhost identities ---'
          for user in github-runner desktopcommander businesaios root; do
            printf '%s=' "$user"
            if timeout 5s ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=3 "$user@127.0.0.1" 'id -un' </dev/null 2>/dev/null; then
              :
            else
              echo unavailable
            fi
          done
