name: Ops Production Bridge Probe

on:
  push:
    branches:
      - feat/owner-intelligence-cockpit
    paths:
      - .github/workflows/ops-production-bridge-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, production]
    environment: production
    timeout-minutes: 5
    steps:
      - name: Diagnose and recover Remote Desktop Commander
        shell: bash
        run: |
          set -u
          echo '--- service state before ---'
          systemctl show remote-desktop-commander.service -p MainPID -p ActiveState -p SubState -p NRestarts -p ExecMainStatus -p Result --no-pager
          pid="$(systemctl show remote-desktop-commander.service -p MainPID --value)"
          if [[ "$pid" =~ ^[1-9][0-9]*$ ]]; then ps -o pid,ppid,user,etime,stat,comm,args -p "$pid" || true; fi
          echo '--- recent service journal ---'
          journalctl -u remote-desktop-commander.service -n 80 --no-pager 2>&1 || true
          echo '--- outbound TCP snapshot ---'
          ss -nt 2>/dev/null | head -n 80 || true
          echo '--- non-root restart attempt ---'
          systemctl --no-ask-password restart remote-desktop-commander.service 2>&1 || true
          sleep 4
          echo '--- service state after ---'
          systemctl show remote-desktop-commander.service -p MainPID -p ActiveState -p SubState -p NRestarts -p ExecMainStatus -p Result --no-pager
