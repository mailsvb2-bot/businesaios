name: Ops Production Bridge Probe

on:
  push:
    branches:
      - feat/owner-intelligence-cockpit
    paths:
      - .github/workflows/ops-production-bridge-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, production]
    environment: production
    timeout-minutes: 5
    steps:
      - name: Verify Remote Desktop Commander restart policy
        shell: bash
        run: |
          set -euo pipefail
          systemctl show remote-desktop-commander.service \
            -p Restart -p RestartUSec -p StartLimitBurst -p StartLimitIntervalUSec \
            -p MainPID -p ActiveState -p SubState -p User -p FragmentPath --no-pager
          echo '--- unit ---'
          systemctl cat remote-desktop-commander.service
