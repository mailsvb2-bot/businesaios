name: Ops Production Bridge Probe

on:
  push:
    branches:
      - feat/owner-intelligence-cockpit
    paths:
      - .github/workflows/ops-production-bridge-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, production]
    environment: production
    timeout-minutes: 5
    steps:
      - name: Identify local listener related to remote agent
        shell: bash
        run: |
          set -u
          for port in 18080 41733; do
            echo "--- port $port root ---"
            curl -sS -i --max-time 3 "http://127.0.0.1:${port}/" 2>&1 | head -n 60 || true
            echo "--- port $port health ---"
            curl -sS -i --max-time 3 "http://127.0.0.1:${port}/health" 2>&1 | head -n 60 || true
          done
          echo '--- tcp owners where visible ---'
          ss -lntp 2>&1 | grep -E '(:18080|:41733)' || true
