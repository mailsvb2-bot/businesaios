name: Ops Production Bridge Probe

on:
  push:
    branches:
      - feat/owner-intelligence-cockpit
    paths:
      - .github/workflows/ops-production-bridge-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, production]
    environment: production
    timeout-minutes: 5
    steps:
      - name: Inspect installed production handoff surfaces
        shell: bash
        run: |
          set -euo pipefail
          echo '--- systemd references ---'
          grep -RInE 'rdc-deploy-request|businesaios-rdc-deploy|desktopcommander|github-runner' /etc/systemd/system /usr/lib/systemd/system 2>/dev/null | head -n 240 || true
          echo '--- path units ---'
          systemctl list-unit-files --type=path --no-pager --no-legend | head -n 120 || true
          echo '--- timers ---'
          systemctl list-timers --all --no-pager | head -n 120 || true
          echo '--- sockets ---'
          systemctl list-sockets --all --no-pager | head -n 160 || true
          echo '--- request dir ACL ---'
          namei -l /var/lib/businesaios/rdc-deploy-request || true
          getfacl -p /var/lib/businesaios/rdc-deploy-request 2>/dev/null || true
          echo '--- runner groups ---'
          id
