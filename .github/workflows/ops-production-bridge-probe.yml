name: Ops Production Bridge Probe

on:
  push:
    branches:
      - feat/owner-intelligence-cockpit
    paths:
      - .github/workflows/ops-production-bridge-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, production]
    environment: production
    timeout-minutes: 5
    steps:
      - name: Inspect installed canonical deploy bridge
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=$(id -un)"
          echo '--- bridge source ---'
          sed -n '1,260p' /usr/local/sbin/businesaios-rdc-deploy
          echo '--- bridge path unit ---'
          systemctl cat businesaios-rdc-deploy.path
          echo '--- bridge service unit ---'
          systemctl cat businesaios-rdc-deploy.service
          echo '--- remote agent candidates ---'
          systemctl list-unit-files --type=service --no-legend | grep -Ei 'desktop|commander|remote' || true
          for unit in remote-desktop-commander.service desktop-commander.service desktopcommander.service; do
            echo "--- $unit ---"
            systemctl show "$unit" -p LoadState -p ActiveState -p SubState -p UnitFileState -p User -p FragmentPath --no-pager 2>/dev/null || true
          done
