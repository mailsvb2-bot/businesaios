name: Ops Production Bridge Probe

on:
  push:
    branches:
      - feat/owner-intelligence-cockpit
    paths:
      - .github/workflows/ops-production-bridge-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, production]
    environment: production
    timeout-minutes: 5
    steps:
      - name: Inspect Remote Desktop Commander reconnect surface
        shell: bash
        run: |
          set -u
          NODE=/opt/node-v24.19.0-linux-x64/bin/node
          CLI=/home/desktopcommander/rdc-app/node_modules/@wonderwhy-er/desktop-commander/dist/index.js
          echo '--- readability ---'
          stat -c '%A %U:%G %n' /home/desktopcommander /home/desktopcommander/rdc-app "$CLI" 2>&1 || true
          echo '--- CLI help ---'
          "$NODE" "$CLI" --help 2>&1 | head -n 120 || true
          echo '--- remote help ---'
          "$NODE" "$CLI" remote --help 2>&1 | head -n 160 || true
          echo '--- reconnect/control references ---'
          grep -RInE 'persist-session|reconnect|disconnect|remote.*status|control.*socket|listen\(' "$(dirname "$CLI")" 2>/dev/null | head -n 120 || true
          echo '--- desktopcommander sockets ---'
          find /run /tmp -maxdepth 4 -type s -user desktopcommander -ls 2>/dev/null | head -n 80 || true
          ss -lnt 2>/dev/null | head -n 100 || true
