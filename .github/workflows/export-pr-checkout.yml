name: Apply client outcome security patch

on:
  pull_request:
    paths:
      - .github/workflows/export-pr-checkout.yml

permissions:
  contents: write

jobs:
  apply-client-outcome-security:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/full-pytest-security-repair
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Verify and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/patches/client-outcome-security.patch.gz.b64)" = "8187c26907b04de8b4932beeb477ac0571a0f27e"
          base64 -d .github/patches/client-outcome-security.patch.gz.b64 | gzip -dc > /tmp/client-outcome-security.patch
          test "$(git hash-object /tmp/client-outcome-security.patch)" = "96a21e5bf8485bce9bf5e062d21d0c300f5ea0e2"
          git apply --check /tmp/client-outcome-security.patch
          git apply /tmp/client-outcome-security.patch
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
      - name: Prove API and decision safety
        run: |
          python -m pytest -q \
            tests/test_decision_core_gate_fail_closed_v27.py \
            tests/test_decision_ledger.py \
            tests/test_single_decision_envelope_definition.py \
            tests/test_runtime_decision_gateway.py \
            tests/test_security.py \
            tests/api \
            tests/unit/client_outcome \
            tests/test_hidden_business_logic_wave9.py \
            tests/test_retention_engine.py \
            tests/test_retention_and_policy_split_v26.py \
            tests/test_retention_engine_split.py
      - name: Commit clean canonical result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patches/client-outcome-security.patch.gz.b64
          rm -f .github/workflows/export-pr-checkout.yml
          rmdir .github/patches 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Register client outcome routes in canonical API perimeter"
          git push origin HEAD:agent/full-pytest-security-repair
