name: Wave 43 apply validated patch

on:
  push:
    branches:
      - agent/coverage-100-wave43-closed-loop-canon

permissions:
  contents: write

concurrency:
  group: wave43-closed-loop-canon
  cancel-in-progress: false

jobs:
  apply-validated-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Decode and verify patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          encoded = Path('.wave43.patch.gz.b64').read_text(encoding='utf-8').strip()
          patch = gzip.decompress(base64.b64decode(encoded))
          Path('/tmp/wave43.patch').write_bytes(patch)
          PY
          git apply --check /tmp/wave43.patch

      - name: Apply exact validated files
        shell: bash
        run: |
          set -Eeuo pipefail
          git apply /tmp/wave43.patch
          rm -f .wave43.patch.gz.b64 .github/workflows/wave43-apply.yml
          git add -A -- \
            execution/closed_loop_orchestrator.py \
            tests/unit/execution/test_closed_loop_orchestrator_wave43.py \
            tests/unit/execution/test_closed_loop_orchestrator_helpers_wave43.py \
            .wave43.patch.gz.b64 \
            .github/workflows/wave43-apply.yml
          git config user.name 'BusinesAIOS Coverage Agent'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Coverage 100 wave 43: close closed-loop line and branch coverage'
          git push origin HEAD:agent/coverage-100-wave43-closed-loop-canon
