name: Protected Production Verification

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: protected-production-verification
  cancel-in-progress: false

jobs:
  authorize:
    name: authorize trusted exact-head production proof
    runs-on: ubuntu-latest
    outputs:
      deep_release_run_id: ${{ steps.resolve.outputs.deep_release_run_id }}
    steps:
      - name: Require default-branch trusted execution
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_SHA}" = "$(git ls-remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Resolve successful exact-SHA Deep Release evidence
        id: resolve
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deep-release-validation.yml/runs?branch=main&event=push&status=success&per_page=50"
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$url" > "$RUNNER_TEMP/deep-release-runs.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["RUNNER_TEMP"] + "/deep-release-runs.json").read_text())
          target = os.environ["TARGET_SHA"]
          matches = [run for run in payload.get("workflow_runs", []) if run.get("head_sha") == target and run.get("conclusion") == "success" and run.get("event") == "push"]
          if not matches:
              raise SystemExit(f"no successful Deep Release push run for exact main SHA {target}")
          run = matches[0]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"deep_release_run_id={run['id']}\n")
          PY

  production-proof:
    name: exact-SHA production synthetic proof
    needs: authorize
    environment: production
    runs-on: [self-hosted, Linux, X64, baios-production]
    timeout-minutes: 30
    env:
      BAIOS_CI_TARGET_SHA: ${{ github.sha }}
      DEEP_RELEASE_RUN_ID: ${{ needs.authorize.outputs.deep_release_run_id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.BAIOS_CI_TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted checkout and deployed exact SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$BAIOS_CI_TARGET_SHA"
          test "$(git -C /opt/businesaios rev-parse HEAD)" = "$BAIOS_CI_TARGET_SHA"

      - name: Download exact-head canonical Deep Release artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/deep-release"
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${DEEP_RELEASE_RUN_ID}/artifacts" \
            > "$RUNNER_TEMP/deep-release-artifacts.json"
          ARTIFACT_ID="$(python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads(Path(os.environ["RUNNER_TEMP"] + "/deep-release-artifacts.json").read_text())
          expected = "deep-release-" + os.environ["BAIOS_CI_TARGET_SHA"]
          matches = [item for item in payload.get("artifacts", []) if item.get("name") == expected and not item.get("expired")]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one non-expired artifact {expected!r}, found {len(matches)}")
          print(matches[0]["id"])
          PY
          )"
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o "$RUNNER_TEMP/deep-release.zip"
          /opt/businesaios/.venv/bin/python -m zipfile -e "$RUNNER_TEMP/deep-release.zip" "$RUNNER_TEMP/deep-release"
          test -s "$RUNNER_TEMP/deep-release/artifacts/ci/release-verdict.json"

      - name: Run canonical production host verifier
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence="$RUNNER_TEMP/production-host-verdict.json"
          sudo --preserve-env=EXPECTED_SHA,PRODUCTION_VERDICT_PATH \
            env EXPECTED_SHA="$BAIOS_CI_TARGET_SHA" PRODUCTION_VERDICT_PATH="$evidence" \
            /opt/businesaios/scripts/server/verify_runtime_host_contract.sh
          test -s "$evidence"
          sudo chmod 0644 "$evidence"

      - name: Finalize the canonical release verdict with post-deploy evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/ci
          /opt/businesaios/.venv/bin/python -m scripts.ci.post_deploy_evidence \
            --base-verdict "$RUNNER_TEMP/deep-release/artifacts/ci/release-verdict.json" \
            --production-evidence "$RUNNER_TEMP/production-host-verdict.json" \
            --output artifacts/ci/release-verdict.json \
            --exact-sha "$BAIOS_CI_TARGET_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("artifacts/ci/release-verdict.json").read_text())
          if payload.get("status") != "PASS" or payload.get("production_verified") is not True:
              raise SystemExit("canonical post-deploy release verdict is not production verified")
          PY
          cp "$RUNNER_TEMP/production-host-verdict.json" artifacts/ci/production-host-evidence.json

      - name: Upload exact-SHA production verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-verification-${{ env.BAIOS_CI_TARGET_SHA }}
          path: artifacts/ci
          if-no-files-found: error
