name: Protected Physical Hardware Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protected-physical-hardware-verification
  cancel-in-progress: false

jobs:
  authorize:
    name: authorize trusted main hardware proof
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.guard.outputs.target_sha }}
    steps:
      - name: Require exact current main
        id: guard
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main" \
            > "$RUNNER_TEMP/main-branch.json"
          MAIN_SHA="$(python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads(Path(os.environ["RUNNER_TEMP"] + "/main-branch.json").read_text())
          print(payload["commit"]["sha"])
          PY
          )"
          test "$GITHUB_SHA" = "$MAIN_SHA"
          echo "target_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"

  hardware-proof:
    name: physical Windows canonical scenarios
    needs: authorize
    environment: production-hardware
    runs-on: [self-hosted, Windows, X64, baios-production-hardware]
    timeout-minutes: 60
    env:
      BAIOS_CI_TARGET_SHA: ${{ needs.authorize.outputs.target_sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.BAIOS_CI_TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify exact trusted checkout
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne "refs/heads/main") { throw "physical hardware proof is restricted to refs/heads/main" }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:BAIOS_CI_TARGET_SHA) { throw "exact checkout mismatch: $actual != $env:BAIOS_CI_TARGET_SHA" }

      - name: Install locked dependencies
        shell: pwsh
        run: |
          python scripts/ci/check_requirements_lock.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install canonical Rust toolchain and locked cache
        shell: pwsh
        run: |
          $toolchain = (python -c "import tomllib; print(tomllib.load(open('rust/rust-toolchain.toml','rb'))['toolchain']['channel'])").Trim()
          if (-not $toolchain) { throw "canonical Rust toolchain channel is empty" }
          rustup toolchain install $toolchain --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location rust/businessaios_safety_core
          cargo fetch --locked
          $fetchStatus = $LASTEXITCODE
          Pop-Location
          if ($fetchStatus -ne 0) { exit $fetchStatus }

      - name: Run existing canonical acceptance gate on physical Windows
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere is required for the physical Windows MSVC environment" }
          $installation = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $installation) { throw "Visual C++ x64 toolchain is required for physical Windows acceptance" }
          $vcvars = Join-Path $installation "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat missing from resolved Visual Studio installation" }
          cmd /d /s /c "`"$vcvars`" && where link && set CARGO_NET_OFFLINE=true && python -m scripts.ci.cli --gate acceptance"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Emit exact-SHA trusted hardware evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/ci | Out-Null
          @'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          payload = {
              "schema": "businessaios_physical_hardware_evidence.v1",
              "status": "PASS",
              "exact_sha": os.environ["BAIOS_CI_TARGET_SHA"],
              "ref": "refs/heads/main",
              "trusted_execution": True,
              "canonical_gate": "acceptance",
              "hardware_class": "baios-production-hardware",
              "runner_name": os.environ.get("RUNNER_NAME"),
              "runner_os": os.environ.get("RUNNER_OS"),
              "checked_at": datetime.now(UTC).isoformat(),
          }
          Path("artifacts/ci/physical_hardware_evidence.json").write_text(
              json.dumps(payload, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload physical hardware evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: physical-hardware-${{ env.BAIOS_CI_TARGET_SHA }}
          path: artifacts/ci
          if-no-files-found: error
