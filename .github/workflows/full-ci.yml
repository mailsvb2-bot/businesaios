name: Full CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-patched-public-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply exact auth perimeter patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/patches/client-outcome-auth.patch.gz.b64 | gzip -dc > /tmp/client-outcome-auth.patch
          test "$(sha256sum /tmp/client-outcome-auth.patch | awk '{print $1}')" = "0c34e11c36f198460f33995e5072aae85b160a0e01e9a4a8d6244cbb8049077b"
          patch -p1 < /tmp/client-outcome-auth.patch
          python -m py_compile adapters/api/fastapi/public_routes.py
      - name: Upload patched source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: patched-public-routes
          path: adapters/api/fastapi/public_routes.py
          if-no-files-found: error
