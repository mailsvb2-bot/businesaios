name: Full CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-patched-public-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply deterministic auth perimeter transformation
        run: |
          python .github/patches/apply_client_outcome_auth.py
          python -m py_compile adapters/api/fastapi/public_routes.py
      - name: Upload patched source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: patched-public-routes
          path: adapters/api/fastapi/public_routes.py
          if-no-files-found: error
