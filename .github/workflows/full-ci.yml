name: Full CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-client-outcome-auth-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/full-pytest-security-repair
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Apply and prove auth perimeter closure
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/patches/client-outcome-auth.patch.gz.b64 | gzip -dc > /tmp/client-outcome-auth.patch
          test "$(sha256sum /tmp/client-outcome-auth.patch | awk '{print $1}')" = "0c34e11c36f198460f33995e5072aae85b160a0e01e9a4a8d6244cbb8049077b"
          git apply --check /tmp/client-outcome-auth.patch
          git apply /tmp/client-outcome-auth.patch
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
          python -m pytest -q \
            tests/api/test_auth_dependencies.py \
            tests/api/test_control_plane_auth_and_guards.py \
            tests/api/test_fastapi_execute_action_stack_wave11.py \
            tests/api/test_public_surface_security_guard_wave183.py \
            tests/unit/client_outcome
          rm -f .github/patches/client-outcome-auth.patch.gz.b64
          rmdir .github/patches 2>/dev/null || true
          cat > .github/workflows/full-ci.yml <<'CANONICAL_WORKFLOW'
          name: Full CI

          on:
            workflow_dispatch:
            push:
              branches:
                - main
            pull_request:

          permissions:
            contents: read

          concurrency:
            group: ${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            full-gate:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
                  with:
                    ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
                    fetch-depth: 0
                    persist-credentials: false
                - name: Verify exact checkout
                  env:
                    EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
                  run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
                - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
                  with:
                    python-version: "3.12"
                - name: Install locked dependencies
                  run: python -m pip install --upgrade pip && python -m pip install -r requirements.lock.txt
                - name: Run canonical full CI gate
                  env:
                    BAIOS_BOOT_SMOKE_ROOT: ${{ runner.temp }}/businesaios-boot-smoke/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-3.12
                  run: python -m scripts.ci.cli --gate full
                - name: Run documented complete pytest tree
                  env:
                    PYTHONDONTWRITEBYTECODE: "1"
                  run: pytest -q
                - name: Upload full gate artifacts
                  if: always()
                  continue-on-error: true
                  uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
                  with:
                    name: full-ci-artifacts
                    path: artifacts/ci
                    if-no-files-found: warn
          CANONICAL_WORKFLOW
          sed -i 's/^          //' .github/workflows/full-ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add adapters/api/fastapi/public_routes.py .github/workflows/full-ci.yml .github/patches
          git diff --cached --check
          git commit -m "Close client outcome auth perimeter"
          git push origin HEAD:agent/full-pytest-security-repair

  full-gate:
    if: github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Canonical full gate resumes on the cleanup commit."
