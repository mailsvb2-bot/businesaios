name: Full CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  align-client-outcome-route-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/full-pytest-security-repair
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Apply authenticated test-client alignment
        run: |
          python .github/patches/apply_client_outcome_test_auth.py
          python -m compileall -q tests/unit/client_outcome
      - name: Install locked dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.lock.txt
      - name: Prove repaired client-outcome route tests
        run: |
          pytest -q \
            tests/unit/client_outcome/test_client_outcome_commercial_state_routes.py \
            tests/unit/client_outcome/test_client_outcome_corrected_economics_and_idempotency.py \
            tests/unit/client_outcome/test_client_outcome_dispute_admin_routes.py \
            tests/unit/client_outcome/test_client_outcome_economic_core_bridge.py \
            tests/unit/client_outcome/test_client_outcome_full_cycle_routes.py \
            tests/unit/client_outcome/test_client_outcome_lifecycle_routes.py \
            tests/unit/client_outcome/test_client_outcome_order_amendment_and_reconciliation.py \
            tests/api/test_public_surface_security_guard_wave183.py
      - name: Commit aligned test clients
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/unit/client_outcome
          git rm .github/patches/apply_client_outcome_test_auth.py
          git diff --cached --check
          git commit -m "Align client outcome route tests with auth perimeter"
      - name: Push aligned test clients
        run: git push origin HEAD:agent/full-pytest-security-repair

  full-gate:
    if: github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Test-client alignment pushed; canonical workflow restoration follows."
