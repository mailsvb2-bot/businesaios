name: Full CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-api-perimeter:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/full-pytest-security-repair' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/full-pytest-security-repair
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Verify and apply exact API perimeter patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/patches/api-perimeter.patch.gz.b64)" = "2955d028f486bd4ad49a9ec5495ec3621ee5498d"
          base64 -d .github/patches/api-perimeter.patch.gz.b64 | gzip -dc > /tmp/api-perimeter.patch
          test "$(git hash-object /tmp/api-perimeter.patch)" = "72b74f6d800e615fefacd5746532826fd3ac3f29"
          git apply --check /tmp/api-perimeter.patch
          git apply /tmp/api-perimeter.patch
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
      - name: Prove critical behavior
        run: |
          pytest -q \
            tests/test_decision_core_gate_fail_closed_v27.py \
            tests/test_decision_ledger.py \
            tests/test_single_decision_envelope_definition.py \
            tests/test_runtime_decision_gateway.py \
            tests/test_security.py \
            tests/api \
            tests/test_hidden_business_logic_wave9.py \
            tests/test_retention_engine.py \
            tests/test_retention_and_policy_split_v26.py \
            tests/test_retention_engine_split.py
      - name: Commit clean canonical result
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD^ -- .github/workflows/full-ci.yml
          rm -f .github/patches/api-perimeter.patch.gz.b64
          rm -f .github/workflows/apply-api-perimeter-patch.yml
          rmdir .github/patches 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Authenticate protected API writes through canonical perimeter"
          git push origin HEAD:agent/full-pytest-security-repair

  full-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.lock.txt
      - name: Run canonical full CI gate
        env:
          BAIOS_BOOT_SMOKE_ROOT: ${{ runner.temp }}/businesaios-boot-smoke/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-3.12
        run: python -m scripts.ci.cli --gate full
      - name: Run documented complete pytest tree
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: pytest -q
      - name: Upload full gate artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-ci-artifacts
          path: artifacts/ci
          if-no-files-found: warn
