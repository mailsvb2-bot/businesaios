name: Full CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-literal-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.lock.txt
      - name: Capture literal pytest output
        shell: bash
        run: |
          set +e
          PYTHONDONTWRITEBYTECODE=1 pytest -q > literal-pytest.log 2>&1
          status=$?
          printf '%s\n' "$status" > literal-pytest.exit-code
          tail -n 500 literal-pytest.log
          exit 0
      - name: Upload literal pytest evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: literal-pytest-evidence
          path: |
            literal-pytest.log
            literal-pytest.exit-code
          if-no-files-found: error
