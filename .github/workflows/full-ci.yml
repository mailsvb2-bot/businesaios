name: Full CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  pull_request_target:
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.event_name == 'pull_request_target' && github.event.pull_request.merged == true && github.event.pull_request.merge_commit_sha || github.event_name == 'pull_request_target' && format('pr-{0}-closed-unmerged', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  BAIOS_CI_TARGET_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merged == true && github.event.pull_request.merge_commit_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  full-gate:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.BAIOS_CI_TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ env.BAIOS_CI_TARGET_SHA }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.lock.txt
      - name: Run canonical full CI gate
        env:
          BAIOS_BOOT_SMOKE_ROOT: ${{ runner.temp }}/businesaios-boot-smoke/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-3.12
        run: python -m scripts.ci.cli --gate full
      - name: Reset mutable tool caches before literal pytest
        shell: bash
        run: |
          find . -type d \
            \( -name ".ruff_cache" -o -name ".pytest_cache" -o -name ".mypy_cache" \) \
            -prune -exec rm -rf {} +
      - name: Run documented complete pytest tree
        env:
          BUSINESAIOS_DEEP_TEST_CLEANUP: "1"
        shell: bash
        run: |
          mkdir -p artifacts/ci/literal-pytest
          set +e
          pytest -q \
            --junitxml=artifacts/ci/literal-pytest/junit.xml \
            2>&1 | tee artifacts/ci/literal-pytest/pytest.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > artifacts/ci/literal-pytest/exit-code.txt
          exit "$status"
      - name: Upload full gate artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-ci-artifacts
          path: artifacts/ci
          if-no-files-found: warn
