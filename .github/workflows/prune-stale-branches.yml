name: Prune stale branches

on:
  push:
    branches:
      - feat/owner-intelligence-cockpit

permissions:
  contents: write

jobs:
  materialize-clean-owner-app:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repair commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/owner-intelligence-cockpit
          fetch-depth: 0

      - name: Restore exact base App and add only owner intelligence wiring
        shell: bash
        run: |
          set -euo pipefail
          base=b509fc2c3b6670104581579e7fe1f69c0b595ee8
          git checkout "$base" -- frontend/src/App.jsx .github/workflows/prune-stale-branches.yml
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/App.jsx')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'import { AcquisitionPlanner } from "./AcquisitionPlanner.jsx";\n',
                  'import { AcquisitionPlanner } from "./AcquisitionPlanner.jsx";\nimport { BusinessIntelligencePanel } from "./BusinessIntelligencePanel.jsx";\n',
              ),
              (
                  '  const acquisitionUrl = `${baseApi}/business-workspace/acquisition-plan`;\n',
                  '  const acquisitionUrl = `${baseApi}/business-workspace/acquisition-plan`;\n  const analyticsUrl = `${baseApi}/analytics/dashboard/${encodeURIComponent(data.tenant_id)}?window_days=30`;\n  const memorySummaryUrl = `${baseApi}/business-memory/summary`;\n  const memoryRecentUrl = `${baseApi}/business-memory/recent-runs`;\n  const goalExecuteUrl = `${baseApi}/goals/execute`;\n',
              ),
              (
                  '  const retryProtectedAccess = async () => {\n',
                  '  const loadBusinessIntelligence = useCallback(async () => {\n    if (!apiKey) return { analytics: null, memory: null, recentRuns: [], errors: ["session"] };\n    const ownerScope = { tenant_id: data.tenant_id, business_id: data.business_id };\n    const [analytics, memory, recent] = await Promise.allSettled([\n      getJson(analyticsUrl, authHeaders),\n      postJson(memorySummaryUrl, ownerScope, authHeaders),\n      postJson(memoryRecentUrl, { ...ownerScope, limit: 5 }, authHeaders)\n    ]);\n    return {\n      analytics: analytics.status === "fulfilled" ? analytics.value?.payload || null : null,\n      memory: memory.status === "fulfilled" ? memory.value : null,\n      recentRuns: recent.status === "fulfilled" && Array.isArray(recent.value?.runs) ? recent.value.runs : [],\n      errors: [analytics, memory, recent].map((item, index) => item.status === "rejected" ? ["analytics", "memory", "recent_runs"][index] : null).filter(Boolean)\n    };\n  }, [apiKey, analyticsUrl, authHeaders, data.business_id, data.tenant_id, memoryRecentUrl, memorySummaryUrl]);\n\n  const runAdvisoryGoal = useCallback(async (goal) => {\n    if (!apiKey) throw new Error("owner_session_required");\n    return postJson(goalExecuteUrl, {\n      goal, business_id: data.business_id, tenant_id: data.tenant_id, max_steps: 1,\n      profile: { industry: profile.industry || "", city: profile.city || "", business_model: profile.business_model || "" },\n      meta: { source: "owner_workspace" }\n    }, { ...authHeaders, "X-Idempotency-Key": crypto.randomUUID() });\n  }, [apiKey, authHeaders, data.business_id, data.tenant_id, goalExecuteUrl, profile.business_model, profile.city, profile.industry]);\n\n  const retryProtectedAccess = async () => {\n',
              ),
              (
                  '      <section className="panel capabilities-panel" aria-labelledby="business-capabilities-title">\n',
                  '      <BusinessIntelligencePanel\n        key={data.business_id}\n        enabled={Boolean(apiKey)}\n        initialGoal={GOALS.find((goal) => goal.value === profile.goal)?.title || "Улучшить результаты бизнеса"}\n        onLoad={loadBusinessIntelligence}\n        onRunGoal={runAdvisoryGoal}\n      />\n\n      <section className="panel capabilities-panel" aria-labelledby="business-capabilities-title">\n',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'unique insertion point violated: {count} for {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          numstat="$(git diff --numstat "$base" -- frontend/src/App.jsx)"
          test "$numstat" = $'38\t0\tfrontend/src/App.jsx'
          grep -F 'meta: { source: "owner_workspace" }' frontend/src/App.jsx >/dev/null
          ! grep -F 'autonomy_tier' frontend/src/App.jsx >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/App.jsx .github/workflows/prune-stale-branches.yml
          git commit -m 'fix: keep owner intelligence app diff clean'
          git push origin HEAD:feat/owner-intelligence-cockpit
