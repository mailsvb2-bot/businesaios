name: Prune stale branches

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed

permissions:
  contents: read

jobs:
  delete-merged-agent-head:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'agent/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact merged head without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Configure scoped GitHub credentials
        shell: bash
        run: gh auth setup-git

      - name: Delete only the exact merged branch revision
        shell: bash
        run: |
          set -euo pipefail
          branch="$TARGET_BRANCH"
          expected_sha="$EXPECTED_SHA"
          case "$branch" in
            agent/*) ;;
            *) echo "refusing to delete non-agent branch: $branch" >&2; exit 64 ;;
          esac
          if [ "${#expected_sha}" -ne 40 ] || [[ "$expected_sha" =~ [^0-9a-f] ]]; then
            echo "merged head SHA is missing or malformed" >&2
            exit 64
          fi

          ref="refs/heads/$branch"
          if git push origin \
            --force-with-lease="$ref:$expected_sha" \
            ":$ref"; then
            echo "deleted=$branch sha=$expected_sha"
            exit 0
          fi

          current_sha="$(git ls-remote origin "$ref" | awk 'NR == 1 { print $1 }')"
          if [ -z "$current_sha" ]; then
            echo "already_absent=$branch"
            exit 0
          fi
          if [ "$current_sha" != "$expected_sha" ]; then
            echo "preserved_changed_ref=$branch expected=$expected_sha current=$current_sha"
            exit 0
          fi

          echo "atomic deletion failed while $branch still points to merged SHA $expected_sha" >&2
          exit 1

  prune-audited-stale-branches:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[prune-stale-branches]')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out exact main commit without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Run canonical doctor gate
        shell: bash
        run: python -m scripts.ci.cli --gate doctor

      - name: Configure scoped GitHub credentials
        shell: bash
        run: gh auth setup-git

      - name: Delete only audited stale agent revisions
        shell: bash
        run: |
          set -euo pipefail
          manifest=".github/branch-prune-audit.txt"
          [ -f "$manifest" ] || { echo "missing audited branch manifest" >&2; exit 64; }

          delete_if_exact() {
            local expected_sha="$1"
            local branch="$2"
            local ref current_sha

            case "$branch" in
              agent/*) ;;
              *) echo "invalid audited ref outside agent namespace: $branch" >&2; return 64 ;;
            esac
            if [ "$branch" = "$DEFAULT_BRANCH" ]; then
              echo "default branch must never be pruned" >&2
              return 64
            fi
            if [ "${#expected_sha}" -ne 40 ] || [[ "$expected_sha" =~ [^0-9a-f] ]]; then
              echo "invalid audited SHA for $branch: $expected_sha" >&2
              return 64
            fi

            ref="refs/heads/$branch"
            if git push origin \
              --force-with-lease="$ref:$expected_sha" \
              ":$ref"; then
              echo "deleted=$branch sha=$expected_sha"
              return 0
            fi

            current_sha="$(git ls-remote origin "$ref" | awk 'NR == 1 { print $1 }')"
            if [ -z "$current_sha" ]; then
              echo "already_absent=$branch"
              return 0
            fi
            if [ "$current_sha" != "$expected_sha" ]; then
              echo "preserved_changed_ref=$branch expected=$expected_sha current=$current_sha"
              return 0
            fi

            echo "atomic deletion failed while $branch still points to audited SHA $expected_sha" >&2
            return 1
          }

          seen=""
          count=0
          while read -r expected_sha branch extra; do
            [ -n "$expected_sha" ] || continue
            if [ -z "${branch:-}" ] || [ -n "${extra:-}" ]; then
              echo "malformed audited branch entry" >&2
              exit 64
            fi
            case " $seen " in
              *" $branch "*) echo "duplicate audited branch: $branch" >&2; exit 64 ;;
            esac
            seen="$seen $branch"
            count=$((count + 1))
            delete_if_exact "$expected_sha" "$branch"
          done < "$manifest"

          if [ "$count" -ne 49 ]; then
            echo "audited branch manifest count changed: $count" >&2
            exit 64
          fi
