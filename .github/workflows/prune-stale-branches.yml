name: Prune stale branches

on:
  pull_request:
    types:
      - closed

permissions:
  contents: read

jobs:
  validate-merged-agent-head:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      startsWith(github.event.pull_request.head.ref, 'agent/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Check out trusted default-base revision without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TRUSTED_BASE_SHA"

      - name: Run canonical doctor gate
        shell: bash
        run: python -m scripts.ci.cli --gate doctor

  delete-merged-agent-head:
    needs: validate-merged-agent-head
    if: needs.validate-merged-agent-head.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Delete only the exact merged branch revision from isolated git state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="$TARGET_BRANCH"
          expected_sha="$EXPECTED_SHA"
          case "$branch" in
            agent/*) ;;
            *) echo "refusing to delete non-agent branch: $branch" >&2; exit 64 ;;
          esac
          if [ "${#expected_sha}" -ne 40 ] || [[ "$expected_sha" =~ [^0-9a-f] ]]; then
            echo "merged head SHA is missing or malformed" >&2
            exit 64
          fi

          repo_dir="$RUNNER_TEMP/branch-gc"
          rm -rf "$repo_dir"
          git init --quiet "$repo_dir"
          cd "$repo_dir"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh auth setup-git

          ref="refs/heads/$branch"
          if git push origin \
            --force-with-lease="$ref:$expected_sha" \
            ":$ref"; then
            echo "deleted=$branch sha=$expected_sha"
            exit 0
          fi

          current_sha="$(git ls-remote origin "$ref" | awk 'NR == 1 { print $1 }')"
          if [ -z "$current_sha" ]; then
            echo "already_absent=$branch"
            exit 0
          fi
          if [ "$current_sha" != "$expected_sha" ]; then
            echo "preserved_changed_ref=$branch expected=$expected_sha current=$current_sha"
            exit 0
          fi

          echo "atomic deletion failed while $branch still points to merged SHA $expected_sha" >&2
          exit 1
