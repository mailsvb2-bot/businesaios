name: Prune stale branches

on:
  pull_request:
    types:
      - closed

permissions:
  contents: read

jobs:
  delete-merged-agent-head:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'agent/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact merged head without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Configure scoped GitHub credentials
        shell: bash
        run: gh auth setup-git

      - name: Delete only the exact merged branch revision
        shell: bash
        run: |
          set -euo pipefail
          branch="$TARGET_BRANCH"
          expected_sha="$EXPECTED_SHA"
          case "$branch" in
            agent/*) ;;
            *) echo "refusing to delete non-agent branch: $branch" >&2; exit 64 ;;
          esac
          if [ "${#expected_sha}" -ne 40 ] || [[ "$expected_sha" =~ [^0-9a-f] ]]; then
            echo "merged head SHA is missing or malformed" >&2
            exit 64
          fi

          ref="refs/heads/$branch"
          if git push origin \
            --force-with-lease="$ref:$expected_sha" \
            ":$ref"; then
            echo "deleted=$branch sha=$expected_sha"
            exit 0
          fi

          current_sha="$(git ls-remote origin "$ref" | awk 'NR == 1 { print $1 }')"
          if [ -z "$current_sha" ]; then
            echo "already_absent=$branch"
            exit 0
          fi
          if [ "$current_sha" != "$expected_sha" ]; then
            echo "preserved_changed_ref=$branch expected=$expected_sha current=$current_sha"
            exit 0
          fi

          echo "atomic deletion failed while $branch still points to merged SHA $expected_sha" >&2
          exit 1
