name: Apply canonical API perimeter patch

on:
  push:
    branches:
      - agent/full-pytest-security-repair

permissions:
  contents: write

concurrency:
  group: apply-api-perimeter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/full-pytest-security-repair
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Verify and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/patches/api-perimeter.patch.gz.b64)" = "2955d028f486bd4ad49a9ec5495ec3621ee5498d"
          base64 -d .github/patches/api-perimeter.patch.gz.b64 | gzip -dc > /tmp/api-perimeter.patch
          test "$(git hash-object /tmp/api-perimeter.patch)" = "72b74f6d800e615fefacd5746532826fd3ac3f29"
          git apply --check /tmp/api-perimeter.patch
          git apply /tmp/api-perimeter.patch

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt

      - name: Prove critical behavior
        run: |
          pytest -q \
            tests/test_decision_core_gate_fail_closed_v27.py \
            tests/test_decision_ledger.py \
            tests/test_single_decision_envelope_definition.py \
            tests/test_runtime_decision_gateway.py \
            tests/test_security.py \
            tests/api \
            tests/test_hidden_business_logic_wave9.py \
            tests/test_retention_engine.py \
            tests/test_retention_and_policy_split_v26.py \
            tests/test_retention_engine_split.py

      - name: Commit clean canonical result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patches/api-perimeter.patch.gz.b64
          rm -f .github/workflows/apply-api-perimeter-patch.yml
          rmdir .github/patches 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Authenticate protected API writes through canonical perimeter"
          git push origin HEAD:agent/full-pytest-security-repair
