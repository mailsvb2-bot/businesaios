name: One-shot exact debt inventory

on:
  push:
    branches:
      - agent/debt-inventory-exact-main
    paths:
      - .github/workflows/debt-inventory-once.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
      - name: Capture exact inventories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/debt-inventory
          python -m ruff check . --output-format=json > /tmp/debt-inventory/ruff.json || true
          python - <<'PY'
          from __future__ import annotations

          import ast
          import json
          import re
          from collections import Counter, defaultdict
          from pathlib import Path

          root = Path('.')
          excluded = {'.git', '.venv', 'venv', 'node_modules', 'target', 'dist', 'artifacts', '__pycache__'}
          broad = []
          production_broad = []
          python_files = []
          micro_modules = []
          wave_tests = []

          def ignored(path: Path) -> bool:
              return bool(excluded.intersection(path.parts))

          for path in root.rglob('*.py'):
              if ignored(path):
                  continue
              relative = path.as_posix()
              python_files.append(relative)
              text = path.read_text(encoding='utf-8', errors='ignore')
              line_count = len(text.splitlines())
              if not relative.startswith('tests/') and line_count <= 20:
                  micro_modules.append({'path': relative, 'lines': line_count})
              if relative.startswith('tests/') and re.search(r'(?:^|/)test_.*wave\d+', relative, re.I):
                  wave_tests.append({'path': relative, 'lines': line_count})
              try:
                  tree = ast.parse(text, filename=relative)
              except SyntaxError:
                  continue
              for node in ast.walk(tree):
                  if not isinstance(node, ast.ExceptHandler):
                      continue
                  kind = None
                  if node.type is None:
                      kind = 'bare'
                  elif isinstance(node.type, ast.Name) and node.type.id in {'Exception', 'BaseException'}:
                      kind = node.type.id
                  if kind is None:
                      continue
                  row = {'path': relative, 'line': node.lineno, 'kind': kind}
                  broad.append(row)
                  if not relative.startswith(('tests/', 'scripts/', 'tools/')):
                      production_broad.append(row)

          ruff_payload = json.loads(Path('/tmp/debt-inventory/ruff.json').read_text(encoding='utf-8') or '[]')
          ruff_by_code = Counter(item.get('code', 'UNKNOWN') for item in ruff_payload)
          ruff_by_top = Counter(str(item.get('filename', '')).split('/', 1)[0] for item in ruff_payload)
          broad_by_top = Counter(row['path'].split('/', 1)[0] for row in production_broad)
          broad_by_file = Counter(row['path'] for row in production_broad)

          summary = {
              'head_sha': __import__('os').environ.get('GITHUB_SHA'),
              'python_files': len(python_files),
              'ruff_total': len(ruff_payload),
              'ruff_by_code': dict(ruff_by_code.most_common()),
              'ruff_by_top_level': dict(ruff_by_top.most_common()),
              'broad_exceptions_all': len(broad),
              'broad_exceptions_production': len(production_broad),
              'broad_by_top_level': dict(broad_by_top.most_common()),
              'broad_top_files': dict(broad_by_file.most_common(100)),
              'wave_test_files': len(wave_tests),
              'wave_test_lines': sum(item['lines'] for item in wave_tests),
              'micro_production_modules_le_20_lines': len(micro_modules),
              'micro_production_lines': sum(item['lines'] for item in micro_modules),
          }
          Path('/tmp/debt-inventory/summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True), encoding='utf-8')
          Path('/tmp/debt-inventory/broad_exceptions.json').write_text(json.dumps(production_broad, indent=2), encoding='utf-8')
          Path('/tmp/debt-inventory/wave_tests.json').write_text(json.dumps(wave_tests, indent=2), encoding='utf-8')
          Path('/tmp/debt-inventory/micro_modules.json').write_text(json.dumps(micro_modules, indent=2), encoding='utf-8')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - name: Upload exact debt inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-debt-inventory
          path: /tmp/debt-inventory
          if-no-files-found: error
